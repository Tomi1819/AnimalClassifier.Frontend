# Opens a pull request when a package or an action has a newer version, which
# CI then lints, tests and builds before it is merged.
version: 2
updates:
  # Minor and patch updates come as one pull request a week.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
