# Lints, tests and builds every pull request, and main after each merge, so
# that a change is known to work before it is merged rather than after.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Reading the code is all this workflow does.
permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs exactly what package-lock.json lists, and fails if it no
      # longer matches package.json.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
