# Builds the image the server runs. On a pull request it is only built, so that
# a change to the Dockerfile or the Caddyfile is known to work before it is
# merged. Once a change is on main it is built again from main and published to
# GitHub's container registry, tagged with the commit it was built from, so that
# the server runs exactly what was built here, and any earlier commit can be run
# again. Then the server is told to run it.
name: CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to a pull request's branch makes an older run's result moot. A run
# on main is never cancelled halfway, as it may be publishing; one that has not
# started yet gives way to a newer one, as only the newest main matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build the image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Image names have to be lower case, and the account's name is not.
      - name: Name the image
        id: names
        run: echo "web=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/animalclassifier-web:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # The builder that can keep its layers in GitHub's cache between runs.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From the checked-out folder, so that .dockerignore applies as it does on
      # a machine. Every run reads the layers main's last run left, and only
      # main's runs leave any, so that pull requests cannot crowd main's out of
      # the cache. The source label links the published image to this repository.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.names.outputs.web }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=web
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,scope=web,mode=max' || '' }}

  # The runner joins the tailnet for the length of the job, as a device tagged
  # tag:ci, which the tailnet's policy lets reach the server's SSH and nothing
  # else. The key it logs in with can only run the deploy script for the website,
  # so all it sends is the commit. The script prints what it does, and if the new
  # version is not healthy it puts the previous one back and fails this job.
  deploy:
    name: Deploy
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # The script waits up to 15 minutes for a deployment of the API to end.
    timeout-minutes: 30
    # Its secrets are only given to runs on main.
    environment: production
    permissions: {}

    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      # The known host is the server's own key, so the deploy key is never
      # offered to anything else. Secrets pasted on Windows may carry carriage
      # returns, which ssh rejects.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: >
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30
          "deploy@$DEPLOY_HOST" "$GITHUB_SHA"
