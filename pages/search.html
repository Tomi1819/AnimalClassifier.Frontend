<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Blocking on purpose: it sets the theme before the first paint. -->
    <script src="/theme-init.js"></script>
    <title>Search Animals - Animal Classifier</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/phone-icon.png" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <img src="/logo.png" alt="Logo" />
        </div>
        <!-- Populated by src/shared/nav.js, which varies the links by session. -->
        <ul id="navLinks"></ul>
      </nav>
    </header>
    <main class="search-main">
      <div class="search-container">
        <h1>Search Animals</h1>
        <p>Find the images an animal was recognised in, from everyone's uploads</p>
        <div class="search-section">
          <form id="searchForm" class="search-input-container" role="search">
            <label class="visually-hidden" for="searchInput">Animal</label>
            <input
              type="text"
              id="searchInput"
              placeholder="Search for animals..."
              autocomplete="off"
              enterkeyhint="search"
            />
            <button class="search-btn" type="submit" aria-label="Search">
              <svg class="search-btn__icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
            </button>
          </form>
          <div class="search-suggestions">
            <h3>Popular searches:</h3>
            <div class="suggestions-container" id="suggestionsContainer"></div>
          </div>
        </div>
        <div id="searchResults" class="search-results" hidden>
          <div class="results-header">
            <h2 id="resultsTitle">Search Results</h2>
            <div class="results-count" id="resultsCount"></div>
          </div>
          <div class="results-list" id="resultsList"></div>
        </div>
        <div id="noResults" class="no-results" hidden>
          <svg class="no-results-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <h2>No animals found</h2>
          <p>Try a different search term or check your spelling</p>
        </div>
        <div id="loadingIndicator" class="loading-indicator" role="status" hidden>
          <div class="loading-spinner"></div>
          <p>Searching...</p>
        </div>
      </div>
    </main>

    <script type="module" src="/src/pages/search.js"></script>
  </body>
</html>
