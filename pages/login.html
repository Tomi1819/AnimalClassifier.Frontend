<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in - Animal Classifier</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="auth-page">
    <header>
      <nav>
        <div class="logo">
          <img src="/logo.png" alt="Logo" />
        </div>
        <!-- Populated by src/shared/nav.js, which varies the links by session. -->
        <ul id="navLinks"></ul>
      </nav>
    </header>

    <main class="auth">
      <section class="auth-card">
        <p class="eyebrow">Sign in</p>
        <h1>Welcome back</h1>
        <p class="auth-card__subtitle">
          Sign in to upload media and pick up your recognition history.
        </p>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <div class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                />
                <path d="m3.6 7.4 8.4 5.9 8.4-5.9" />
              </svg>
              <input
                type="email"
                id="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <div class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="10" rx="2.5" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input
                type="password"
                id="password"
                autocomplete="current-password"
                placeholder="Your password"
                required
              />
              <button
                type="button"
                class="field__toggle"
                data-password-toggle="password"
                aria-label="Show password"
              >
                <svg
                  class="field__toggle-icon"
                  data-icon="eye"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="field__toggle-icon"
                  data-icon="eye-off"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  hidden
                >
                  <path
                    d="M10.6 6.2A9.4 9.4 0 0 1 12 6c6 0 9.5 6 9.5 6a17.7 17.7 0 0 1-3.4 4M6.2 8.1A17.4 17.4 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 3.4-.6"
                  />
                  <path d="m3 3 18 18" />
                </svg>
              </button>
            </div>
          </div>

          <button class="btn" type="submit">Sign in</button>
        </form>

        <!-- Revealed by src/pages/login.js only where the browser can use
             passkeys, so it never offers something that cannot work. -->
        <div id="passkeySignIn" class="passkey-signin" hidden>
          <p class="passkey-signin__divider"><span>or</span></p>
          <button id="passkeyButton" class="btn-ghost btn-ghost--block" type="button">
            <svg class="btn-ghost__icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10" cy="9" r="4" />
              <path d="M13.5 11.5 21 19m-3 0 1.5 1.5M16 17l1.5 1.5M4 20a6 6 0 0 1 8-5.7" />
            </svg>
            Sign in with a passkey
          </button>
        </div>

        <p id="formMessage" class="message" hidden></p>

        <p class="auth-card__switch">
          <a href="forgot-password.html">Forgot your password?</a>
        </p>

        <p class="auth-card__switch">
          New here? <a href="register.html">Create an account</a>
        </p>
      </section>
    </main>

    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
