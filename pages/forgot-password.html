<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password - Animal Classifier</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="auth-page">
    <header>
      <nav>
        <div class="logo">
          <img src="/logo.png" alt="Logo" />
        </div>
        <!-- Populated by src/shared/nav.js, which varies the links by session. -->
        <ul id="navLinks"></ul>
      </nav>
    </header>

    <main class="auth">
      <section class="auth-card">
        <p class="eyebrow">Forgot password</p>
        <h1>Reset your password</h1>
        <p class="auth-card__subtitle">
          Enter the address you registered with and we will send you a link for
          choosing a new password.
        </p>

        <form id="forgotPasswordForm" class="auth-form">
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <div class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                />
                <path d="m3.6 7.4 8.4 5.9 8.4-5.9" />
              </svg>
              <input
                type="email"
                id="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <button class="btn" type="submit">Send the link</button>
        </form>

        <p id="formMessage" class="message" hidden></p>

        <p class="auth-card__switch">
          Remembered it? <a href="login.html">Sign in</a>
        </p>
      </section>
    </main>

    <script type="module" src="/src/pages/forgot-password.js"></script>
  </body>
</html>
