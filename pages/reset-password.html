<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Blocking on purpose: it sets the theme before the first paint. -->
    <script src="/theme-init.js"></script>
    <!-- The address of this page carries the reset token, and a referrer would
         hand it to whatever the page happens to load. -->
    <meta name="referrer" content="no-referrer" />
    <title>Choose a new password - Animal Classifier</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="auth-page">
    <header>
      <nav>
        <div class="logo">
          <img src="/logo.png" alt="Logo" />
        </div>
        <!-- Populated by src/shared/nav.js, which varies the links by session. -->
        <ul id="navLinks"></ul>
      </nav>
    </header>

    <main class="auth">
      <section class="auth-card">
        <p class="eyebrow">New password</p>
        <h1>Choose a new password</h1>
        <p class="auth-card__subtitle">
          Pick a password you have not used here before. Signing in again
          afterwards will use the new one.
        </p>

        <form id="resetPasswordForm" class="auth-form">
          <div class="field">
            <label class="field__label" for="password">New password</label>
            <div class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="10" rx="2.5" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input
                type="password"
                id="password"
                autocomplete="new-password"
                placeholder="Choose a password"
                required
              />
              <button
                type="button"
                class="field__toggle"
                data-password-toggle="password"
                aria-label="Show password"
              >
                <svg
                  class="field__toggle-icon"
                  data-icon="eye"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="field__toggle-icon"
                  data-icon="eye-off"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  hidden
                >
                  <path
                    d="M10.6 6.2A9.4 9.4 0 0 1 12 6c6 0 9.5 6 9.5 6a17.7 17.7 0 0 1-3.4 4M6.2 8.1A17.4 17.4 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 3.4-.6"
                  />
                  <path d="m3 3 18 18" />
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="confirmation">
              Repeat the password
            </label>
            <div class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="10" rx="2.5" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input
                type="password"
                id="confirmation"
                autocomplete="new-password"
                placeholder="Type it once more"
                required
              />
              <button
                type="button"
                class="field__toggle"
                data-password-toggle="confirmation"
                aria-label="Show password"
              >
                <svg
                  class="field__toggle-icon"
                  data-icon="eye"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="field__toggle-icon"
                  data-icon="eye-off"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  hidden
                >
                  <path
                    d="M10.6 6.2A9.4 9.4 0 0 1 12 6c6 0 9.5 6 9.5 6a17.7 17.7 0 0 1-3.4 4M6.2 8.1A17.4 17.4 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 3.4-.6"
                  />
                  <path d="m3 3 18 18" />
                </svg>
              </button>
            </div>
          </div>

          <button class="btn" type="submit">Change my password</button>
        </form>

        <p id="formMessage" class="message" hidden></p>

        <p class="auth-card__switch">
          Need a new link? <a href="forgot-password.html">Ask for one</a>
        </p>
      </section>
    </main>

    <script type="module" src="/src/pages/reset-password.js"></script>
  </body>
</html>
